[package]
name = "waku-browser"
version = "0.1.0"
edition = "2024"
description = "Hidden WebView2 helper for Waku: passes Cloudflare checks and catches video URLs players build in JS"

[[bin]]
name = "waku-browser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
