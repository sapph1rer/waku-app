# ─────────────────────────────────────────────────────────────────────────────

[[source]]
id = "akih"
name = "Aki-H"
base = "https://aki-h.com"
enabled = true
adult = true
note = "18+ — series /<slug>/, episodes /episode/<slug>/ (not verified yet)"
latest_paths = ["/latest/", "/"]
search_path = "/?s={q}"
episode_path = '^/episode/[^/]+/?$'
ignore_paths = ["latest", "popular", "az-list", "genre", "episode"]
title_strip = '\s*(ตอนที่|ซับไทย|พากย์ไทย|EP\.?\s*\d).*$'

