# ─────────────────────────────────────────────────────────────────────────────
# 18+ (hentai) — adult = true: ใช้เฉพาะเมื่อเปิด "แหล่ง 18+" ในหน้าตั้งค่า (ปิดไว้เป็นค่าเริ่มต้น)
